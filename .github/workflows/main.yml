name: Node.js CI/CD with Docker

on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > /home/actions-runner-frontend/jazzam-frontend/jazzaam-nextjs/jazzaam-nextjs/.env
          echo ".env file created successfully."

      - name: Build Docker Image
        run: |
          cd /home/actions-runner-frontend/jazzam-frontend/jazzaam-nextjs/jazzaam-nextjs
          sudo -u jazzam docker build --no-cache -t jazzam-frontend-image:latest .


      - name: Stop & Remove Existing Container
        run: |
          CONTAINER_ID=$(sudo -u jazzam docker ps -aq --filter "name=jazzam-frontend-container")
          if [ ! -z "$CONTAINER_ID" ]; then
            sudo -u jazzam docker stop jazzam-frontend-container
            sudo -u jazzam docker rm jazzam-frontend-container
          fi

      - name: Run New Container
        run: |
          sudo -u jazzam docker run -d -p 3000:3000 --name jazzam-frontend-container --env-file /home/actions-runner-frontend/jazzam-frontend/jazzaam-nextjs/jazzaam-nextjs/.env jazzam-frontend-image:latest


      - name: Prune Unused Images & Containers
        run: |
          sudo -u jazzam docker system prune -af

  nginx:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Nginx Configuration
        run: |
          sudo nginx -t
          sudo systemctl restart nginx
